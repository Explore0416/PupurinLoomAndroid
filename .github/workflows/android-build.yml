name: Build APK

# 触发条件：
#   - 向 main push 或发起 PR：构建 Debug/Release APK 并作为 Actions 产物
#   - 推送版本标签 v*.*.*（例如 v0.4.2）：构建 APK 并自动发布到 GitHub Releases
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # 打 tag 时允许发布 Release 并上传 APK

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Write local.properties (SDK dir)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build APKs (debug + release)
        run: ./gradlew assembleDebug assembleRelease --no-daemon
        env:
          ANDROID_HOME: $ANDROID_HOME

      - name: Upload Debug APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/
          if-no-files-found: ignore

      # 仅当是版本标签（v0.4.2 之类）触发时，把 APK 发布到 GitHub Releases
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }} 的自动构建产物。

            修改要点见 [CHANGELOG](CHANGELOG.md)（若存在）与 README。
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk