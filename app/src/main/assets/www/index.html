<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>铃言织机° · Pupurin° Loom</title>
    <script type="module" crossorigin src="./assets/index-D3PfY8gi.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/xyflow-D7BwyjEn.js">
    <link rel="modulepreload" crossorigin href="./assets/monaco-BYShpLcS.js">
    <link rel="stylesheet" crossorigin href="./assets/monaco-BEepC2D7.css">
    <link rel="stylesheet" crossorigin href="./assets/index-D-eQqGrH.css">
    <style>
      /* 铃言织机° 竖屏窄屏适配（打包前端无源码，故用全局安全覆盖）
         目标：手机竖屏下不横向溢出、文字不撑爆宽度。仅在窄竖屏生效。 */
      @media (max-width: 860px) and (orientation: portrait) {
        html, body, #root {
          width: 100% !important;
          max-width: 100% !important;
          min-width: 0 !important;
          overflow-x: hidden !important;
        }
        *,
        *::before,
        *::after { box-sizing: border-box !important; }
        /* 允许弹性子项收缩到内容宽度以内，避免把整页撑宽 */
        * { min-width: 0 !important; }
        /* 长文本（中文 / 长单词）自动换行，不再溢出容器 */
        * { overflow-wrap: anywhere !important; }
        /* 代码编辑器 / 流程画布等自管理宽度组件：不撑开整页 */
        .monaco-editor,
        .monaco-editor-background,
        .react-flow,
        .react-flow__pane,
        .react-flow__renderer,
        .xyflow { width: 100% !important; max-width: 100% !important; }
        /* 编辑器内部保持等宽、不换行，避免破坏代码排版 */
        .monaco-editor *,
        .monaco-editor-background *,
        textarea,
        pre,
        code { overflow-wrap: normal !important; overflow: auto !important; }
        /* 顶部操作条等常见工具条：允许换行、稍减字号 */
        header,
        nav,
        [class*="toolbar"],
        [class*="menu-bar"],
        [role="toolbar"] { flex-wrap: wrap !important; font-size: 13px !important; }
        input,
        select { font-size: 16px !important; }
        /* ---- 竖屏易用性增强 ---- */
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body { font-size: 14px !important; line-height: 1.5 !important; }
        /* 可点目标不小于拇指舒适区（不强行拉伸密集工具条内的小图标） */
        button,
        [role="button"],
        a[href] { -webkit-tap-highlight-color: transparent; }
        /* 主操作按钮在竖屏更醒目、更好点 */
        [class*="btn-primary"],
        [class*="primary-button"],
        [class*="primary-action"],
        [class*="button-primary"] { min-height: 44px !important; }
        /* 底部 Dock / 快捷栏吸底并留出系统手势安全区，避免被手势条遮挡 */
        [class*="dock"],
        [class*="bottom-bar"],
        [class*="quick-bar"],
        [class*="status-bar"] {
          padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)) !important;
          max-width: 100% !important;
          overflow-x: auto !important;
        }
        /* 窄屏下减少整页左右留白，让内容更充分利用屏幕 */
        main,
        [class*="container"],
        [class*="wrapper"],
        [class*="content"] { padding-left: 12px !important; padding-right: 12px !important; }
        /* 表格 / 面板在竖屏内横向滚动而非撑破页面 */
        [class*="table"],
        [class*="list"] { max-width: 100% !important; }
        /* 弹窗 / 抽屉在竖屏贴合可用高度与宽度 */
        [role="dialog"],
        [class*="modal"],
        [class*="drawer"] {
          max-width: 94vw !important;
          max-height: 84vh !important;
        }
        /* 大标题在窄屏适度缩小，避免换行过多 */
        h1, h2, [class*="title"] { letter-spacing: 0.2px !important; }
      }
    </style>
  </head>
  <body class="bg-loom-bg text-loom-text">
    <div id="root"></div>
  </body>
</html>
